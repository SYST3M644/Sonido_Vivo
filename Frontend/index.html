<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Sonido</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome">
        <img src="imagenes/banner_principal.jpg" alt="Bienvenido a la Tienda de Sonido" class="welcome-banner">
        <h1>Bienvenido a la Tienda de Sonido</h1>
    </div>

    <div id="catalogo">
        <h1 class="title-products">Tu sonido, nuestra pasión.</h1>

        <!-- Productos destacados: JS los llena automáticamente -->
        <h2 class="title-destacados">Destacados</h2>
        <div class="row" id="destacados-container"></div>

        <!-- Barra grande de categorías: JS la llena automáticamente -->
        <div class="category-filter-bar" id="category-filter-bar"></div>

        <div class="row filters-row">
            <div>
                <form class="search-form">
                    <input 
                        class="search-input" 
                        type="search" 
                        name="buscar" 
                        id="search-input"
                        placeholder="Buscar producto"
                    >
                </form>

                <select class="select-order" id="select-order">
                    <option value="default">Ordenar por</option>
                    <option value="asc">Precio más bajo</option>
                    <option value="desc">Precio más alto</option>
                </select>
            </div>

             <div class="header-icons">
                <a href="nosotros.html" class="cart-link">
                    ℹ️ Nosotros
                </a>

                <a href="contacto.html" class="cart-link">
                    📞 Contacto
                </a>

                <a href="cuenta.html" class="cart-link">
                    👤 Cuenta
                </a>
 
                <a href="carrito.html" class="cart-link">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </a>
            </div>
        </div>

        <!-- Aquí JS va a insertar los productos generados desde el arreglo -->
        <div class="row" id="products-container"></div>

    </div>

    <footer>
        <p>© 2026 Tienda de Sonido. Todos los derechos reservados.</p>
    </footer>

    <!-- Conectamos el JS que dibuja los productos y maneja el carrito -->
    <script src="productos.js"></script>

</body>

</html>
